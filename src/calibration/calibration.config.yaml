    - 68
    - 69
    - 70
    - 71
  delete_temporary_checkpoints: true
  tabpfn:
    backend: api
    requested_model_version: v2.5
    requested_model_path: v2.5_default
    effective_model_version: api_2.5_plus
    numeric_source_root: output/ood_results_TabPFN-2.5-Plus-Numeric
    text_source_root: output/ood_results_TabPFN-2.5-Plus-Text

full_plot:
  output_dir: figures/final
  formats:
    - png
    - pdf
    - svg
  dpi: 300
  bootstrap_iterations: 10000
  bootstrap_seed: 20260715
  include_task_appendix: true

full_plot_gpt:
  output_dir: figures/final_with_gpt
  formats:
    - png
    - pdf
    - svg
  dpi: 300
  bootstrap_iterations: 10000
  bootstrap_seed: 20260715
  include_task_appendix: true
  prediction_inventory: output/w_error_relationship_full/OOD/csv/prediction_source_inventory.csv
  combined_summary: output/ood_summary_reports/Combined/data/all_model_families_ood_summary.csv

confidence:
